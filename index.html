<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ateliê de crochê</title>
<meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151b23" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{
  --bg:#f6f8fa; --surface:#ffffff; --subtle:#f6f8fa; --ink:#1f2328; --muted:#59636e; --line:#d1d9e0; --line-soft:#d1d9e0b3;
  --accent:#1f883d; --accent-hover:#1c8139; --accent-ink:#ffffff; --accent-fg:#1a7f37; --accent-soft:#dafbe1; --accent-bd:#4ac26b66;
  --blue:#0969da; --blue-soft:#ddf4ff; --blue-bd:#54aeff66;
  --yellow:#9a6700; --yellow-soft:#fff8c5; --yellow-bd:#d4a72c66;
  --orange:#bc4c00; --orange-soft:#fff1e5; --orange-bd:#fb8f4466;
  --bad:#d1242f; --bad-soft:#ffebe9; --bad-bd:#ff818266;
  --purple:#8250df; --purple-soft:#fbefff; --purple-bd:#c297ff66;
  --gray:#59636e; --gray-soft:#eff2f5; --gray-bd:#d1d9e0;
  --btn:#f6f8fa; --btn-hover:#eff2f5; --btn-bd:#d1d9e0;
  --shadow:0 1px 0 #1f23280a;
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  --mono:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1117; --surface:#0d1117; --subtle:#151b23; --ink:#f0f6fc; --muted:#9198a1; --line:#3d444d; --line-soft:#3d444db3;
    --accent:#238636; --accent-hover:#29903b; --accent-ink:#ffffff; --accent-fg:#3fb950; --accent-soft:#2ea04326; --accent-bd:#2ea04366;
    --blue:#4493f8; --blue-soft:#388bfd1a; --blue-bd:#388bfd66;
    --yellow:#d29922; --yellow-soft:#bb800926; --yellow-bd:#bb800966;
    --orange:#db6d28; --orange-soft:#db6d281a; --orange-bd:#db6d2866;
    --bad:#f85149; --bad-soft:#f851491a; --bad-bd:#f8514966;
    --purple:#ab7df8; --purple-soft:#ab7df826; --purple-bd:#ab7df866;
    --gray:#9198a1; --gray-soft:#656c7633; --gray-bd:#3d444d;
    --btn:#212830; --btn-hover:#262c36; --btn-bd:#3d444d;
    --shadow:none;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-weight:600;margin:0;text-wrap:balance}
h1{font-size:16px}
h2{font-size:16px}
h3{font-size:14px}
button,input,select{font:inherit;color:inherit}
.num,.kv dd,.nums b,.pos{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;border-radius:6px}
.top{position:sticky;top:0;z-index:5;background:var(--subtle);border-bottom:1px solid var(--line)}
.top-in{max-width:1012px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1::before{content:"";display:inline-block;width:20px;height:20px;border-radius:5px;background:var(--accent) url(icon-192.png) center/cover;vertical-align:-4px;margin-right:8px}
.brand small{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -8px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{position:relative;padding:8px;margin-bottom:0;text-decoration:none;color:var(--ink);white-space:nowrap;border-radius:6px;display:inline-flex;align-items:center;gap:6px}
nav.tabs a:hover{background:var(--btn-hover)}
nav.tabs a[aria-current="page"]{font-weight:600}
nav.tabs a[aria-current="page"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:6px;background:var(--accent)}
nav.tabs .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:2em;background:var(--gray-soft);color:var(--ink);font-size:12px;font-weight:500;line-height:18px;text-align:center}
#timerbar{background:var(--accent-soft);border-bottom:1px solid var(--accent-bd);color:var(--ink)}
#timerbar .in{max-width:1012px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
#timerbar .in > span:first-child::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent-fg);margin-right:8px;vertical-align:1px}
#timerbar .sp{flex:1}
#timerbar button{background:var(--accent);color:var(--accent-ink);border:1px solid #1f23281a;border-radius:6px;padding:3px 12px;font-weight:500;cursor:pointer}
#timerbar button.ghost{background:var(--btn);color:var(--ink);border-color:var(--btn-bd)}
main{max-width:1012px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.head .sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{border:1px solid var(--btn-bd);background:var(--btn);border-radius:6px;padding:5px 16px;cursor:pointer;font-weight:500;line-height:20px;box-shadow:var(--shadow)}
.btn:hover{background:var(--btn-hover)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:#1f23281a}
.btn.pri:hover{background:var(--accent-hover)}
.btn.bad{color:var(--bad)}
.btn.bad:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:3px 12px;font-size:12px}
.icon{border:1px solid var(--btn-bd);background:var(--btn);border-radius:6px;width:28px;height:28px;cursor:pointer;display:inline-grid;place-items:center;font-weight:600}
.icon:hover{background:var(--btn-hover)}
.icon:disabled{opacity:.4;cursor:default}
.acoes{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.acao{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.acao span{font-weight:400;font-size:12px;color:var(--muted)}
.acao:hover{border-color:var(--muted);background:var(--subtle)}
.acao.pri{background:var(--accent);color:var(--accent-ink);border-color:#1f23281a}
.acao.pri:hover{background:var(--accent-hover)}
.acao.pri span{color:var(--accent-ink);opacity:.85}
.card > h2{margin:-16px -16px 0;padding:10px 16px;background:var(--subtle);border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;font-size:14px}
.kv{display:grid;grid-template-columns:1fr auto;margin:0}
.kv dt,.kv dd{padding:8px 0;border-bottom:1px solid var(--line-soft);margin:0}
.kv dt{color:var(--muted)}
.kv dd{text-align:right;font-weight:600}
.kv dt:last-of-type,.kv dd:last-of-type{border-bottom:0}
.kv .bad{color:var(--bad)}
.kv .good{color:var(--accent-fg)}
.meta-bar{display:flex;flex-direction:column;gap:4px}
.bar{height:8px;border-radius:6px;background:var(--gray-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent-fg)}
.chart{width:100%;height:auto;display:block}
.chart .c-lab{fill:var(--muted);font-size:13px;font-family:var(--font)}
.chart .c-val{fill:var(--ink);font-size:13px;font-weight:600;font-family:var(--font)}
.chart .c-bar{fill:var(--accent-fg)}
.hbars{display:grid;grid-template-columns:minmax(0,max-content) minmax(80px,1fr) auto;gap:10px 12px;align-items:center;font-size:14px}
.hb{display:contents;cursor:pointer}
.hb-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:22ch;color:var(--ink)}
.hb-t{height:14px;background:var(--gray-soft);border-radius:7px;overflow:hidden}
.hb-t i{display:block;height:100%;background:var(--accent-fg);border-radius:7px}
.hb-v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.hb:hover .hb-n{text-decoration:underline}
.hb-tot{margin:0}
.pill{display:inline-block;border-radius:2em;padding:0 7px;font-size:12px;font-weight:500;line-height:18px;white-space:nowrap;border:1px solid transparent}
.t-pronta{background:var(--accent-soft);color:var(--accent-fg);border-color:var(--accent-bd)}
.t-simples{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-bd)}
.t-medio{background:var(--orange-soft);color:var(--orange);border-color:var(--orange-bd)}
.t-complexo{background:var(--purple-soft);color:var(--purple);border-color:var(--purple-bd)}
.t-acessorio{background:var(--gray-soft);color:var(--gray);border-color:var(--gray-bd)}
select.status{border-radius:2em;border:1px solid transparent;padding:0 8px;font-weight:500;font-size:12px;line-height:20px;cursor:pointer}
.st-fila{background:var(--gray-soft);color:var(--gray);border-color:var(--gray-bd)!important}
.st-fio{background:var(--yellow-soft);color:var(--yellow);border-color:var(--yellow-bd)!important}
.st-fazendo{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-bd)!important}
.st-pronto{background:var(--purple-soft);color:var(--purple);border-color:var(--purple-bd)!important}
.st-entregue{background:var(--accent-soft);color:var(--accent-fg);border-color:var(--accent-bd)!important}
.st-cancelado{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-bd)!important}
.lista{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.lista > .ped{border:0;border-top:1px solid var(--line);border-radius:0}
.lista > .ped:first-child{border-top:0}
.ped{background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.ped:hover{background:var(--subtle)}
.ped[data-s="Entregue"],.ped[data-s="Cancelado"]{opacity:.75}
.ped-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pos{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:24px}
.ped-top h3{flex:1;min-width:140px;cursor:pointer;font-size:16px}
.ped-top h3:hover{color:var(--blue);text-decoration:underline}
.ped-meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12px;color:var(--muted)}
.prazo.warn{color:var(--yellow);font-weight:600}
.prazo.bad{color:var(--bad);font-weight:600}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.prog .bar{flex:1;max-width:260px}
.nums{display:flex;flex-wrap:wrap;gap:4px 20px}
.nums div{display:flex;flex-direction:column}
.nums small{color:var(--muted);font-size:12px}
.nums b{font-weight:600}
.nums .bad b{color:var(--bad)}
.nums .sug b{color:var(--muted);font-weight:400}
.ped-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ped-acts .sp{flex:1}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:500}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:150px}
.row.feito .grow b{text-decoration:line-through;color:var(--muted)}
.sit{border:1px solid transparent;border-radius:2em;padding:2px 12px;font-weight:500;font-size:12px;cursor:pointer;min-width:84px}
.sit-Cheio{background:var(--accent);color:var(--accent-ink)}
.sit-Tem{background:var(--accent-soft);color:var(--accent-fg);border-color:var(--accent-bd)}
.sit-Pouco{background:var(--yellow-soft);color:var(--yellow);border-color:var(--yellow-bd)}
.sit-Acabou{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-bd)}
.sit-Nao{background:var(--gray-soft);color:var(--gray);border-color:var(--gray-bd)}
.empty{padding:32px;text-align:center;color:var(--muted)}
.aviso{background:var(--yellow-soft);border:1px solid var(--yellow-bd);color:var(--ink);border-radius:6px;padding:12px 16px}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:14px;font-weight:600}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 12px;line-height:20px;min-width:0;width:100%;box-shadow:inset 0 1px 0 #d1d9e033}
.field input:focus,.field select:focus{border-color:var(--blue);outline:1px solid var(--blue);outline-offset:-1px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.fgrid .full{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted);margin:0}
.sugbox{background:var(--accent-soft);border:1px solid var(--accent-bd);border-radius:6px;padding:8px 12px;font-size:13px}
.err{color:var(--bad);font-weight:600;margin:0}
.res-big{font-size:32px;font-weight:600;color:var(--accent-fg)}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
details.card summary{margin:-16px;padding:10px 16px}
details.card[open] summary{margin-bottom:0;border-bottom:1px solid var(--line)}
.modal{position:fixed;inset:0;z-index:20;background:#1f232866;display:flex;align-items:flex-start;justify-content:center;padding:32px 12px;overflow-y:auto}
.modal[hidden]{display:none}
.sheet{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:100%;max-width:560px;box-shadow:0 8px 24px #42474e33}
.m-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.m-h h2{flex:1;font-size:14px}
.m-c{padding:16px;display:flex;flex-direction:column;gap:12px}
.m-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.m-f .sp{flex:1}
.x{border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;border-radius:6px;width:28px;height:28px}
.x:hover{background:var(--btn-hover)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;z-index:30;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 8px 24px #42474e33}
#toast.on{opacity:1}
#toast.bad{background:var(--bad);color:#fff}
.login{max-width:340px;margin:48px auto;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.login img{width:64px;height:64px;border-radius:14px}
.login h2{font-size:24px;font-weight:300}
#sync.off{color:var(--yellow);font-weight:600}
#sync.ok{color:var(--accent-fg)}
code{font-family:var(--mono);font-size:85%;background:var(--gray-soft);padding:2px 6px;border-radius:6px}
.tm{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:8px 0 32px}
.tm-top{width:100%;display:flex;align-items:center;gap:8px}
.tm-top .sp{flex:1}
.tm-nome{font-size:24px}
.tm-clock{font-family:var(--mono);font-size:clamp(56px,17vw,128px);font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.tm-clock.on{color:var(--ink)}
.tm-sub{color:var(--muted)}
.tm-prog{width:min(420px,100%);display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tm-go{width:min(320px,100%);padding:22px;border-radius:999px;border:1px solid #1f23281a;background:var(--accent);color:#fff;font-size:22px;font-weight:600;cursor:pointer;box-shadow:0 1px 0 #1f23281a}
.tm-go:hover{background:var(--accent-hover)}
.tm-go.on{background:var(--btn);color:var(--ink);border-color:var(--btn-bd)}
.tm-go.on:hover{background:var(--btn-hover)}
.tm-done{width:min(320px,100%);padding:10px}
.tm-pick{display:flex;flex-direction:column;gap:12px}
.tm-item{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border:0;border-top:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;cursor:pointer}
.tm-item:first-child{border-top:0}
.tm-item:hover{background:var(--subtle)}
.tm-item .grow{flex:1;display:flex;flex-direction:column;gap:2px}
.tm-t{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);flex:none;background:repeating-linear-gradient(45deg,var(--gray-soft) 0 4px,transparent 4px 8px)}
.sw.big{width:36px;height:36px}
.corbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.corbox .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--btn-bd);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--btn);color:var(--ink);padding:4px 12px;font-size:12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--btn-bd)}
.seg button.on{background:var(--surface);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.vh{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
label.btn{display:inline-block}
@media (max-width:640px){
  .acoes{grid-template-columns:1fr 1fr}
  .acao.pri{grid-column:span 2}
  .fgrid{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  main{padding-top:16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1>Ateliê de crochê</h1><small id="sync"></small><span class="sp" style="flex:1"></span><button class="btn sm" id="sair" hidden>Sair</button></div>
    <nav class="tabs" id="tabs" aria-label="Seções"></nav>
  </div>
</header>
<div id="timerbar" hidden></div>
<main id="app"><div class="empty">Carregando…</div></main>
<div id="modal" class="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mtitle" id="modalBody"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="arquivoBackup" accept=".json,application/json" hidden>
<script type="module" src="app.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
